<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masa Tenisi Turnuva Yönetim Sistemi</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --light: #ecf0f1; --danger: #e74c3c; --vote: #f39c12; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #f0f2f5; color: #333; padding-bottom: 60px; }
        
        .navbar { background: var(--primary); display: flex; justify-content: space-around; padding: 0; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .navbar button { flex: 1; padding: 15px; background: transparent; border: none; color: #bdc3c7; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.3s; border-bottom: 4px solid transparent; }
        .navbar button.active { color: white; border-bottom: 4px solid var(--accent); background: rgba(255,255,255,0.05); }

        .container { max-width: 900px; margin: 0 auto; padding: 15px; }
        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }

        /* Sub-Navbar */
        .sub-navbar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .sub-tab-btn { flex: 1; padding: 8px; border: 1px solid #ddd; background: #f9f9f9; color: #555; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; transition: all 0.2s; text-transform: uppercase; }
        .sub-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Generic Styles */
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); padding: 15px; margin-bottom: 15px; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; width: 100%; margin-top: 5px;}
        .btn-primary { background: var(--accent); }
        .btn-danger { background: var(--danger); }
        .btn-secondary { background: #34495e; }
        .btn-warning { background: #f39c12; color: white; }
        
        input, select { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }

        /* History Accordion */
        .history-type-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .history-btn { padding: 8px 15px; background: #ddd; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; color: #555; }
        .history-btn.active { background: var(--primary); color: white; }

        .accordion-item { border: 1px solid #ddd; border-radius: 5px; margin-bottom: 10px; background: white; overflow: hidden; }
        .accordion-header { padding: 15px; background: #f9f9f9; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .accordion-header:hover { background: #f1f1f1; }
        .accordion-content { display: none; padding: 15px; border-top: 1px solid #ddd; }
        .accordion-content.open { display: block; }

        /* Tournament Internal Tabs */
        .inner-navbar { display: flex; border-bottom: 1px solid #ddd; margin-bottom: 15px; }
        .inner-navbar button { flex: 1; padding: 10px; background: transparent; border: none; cursor: pointer; color: #777; font-weight: 600; border-bottom: 3px solid transparent; }
        .inner-navbar button.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        /* Table Styles */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #eee; }
        th { background: #eee; color: #333; }
        .top8 { background-color: #e8f5e9; }
        .withdrawn-row { background: #333; color: #ccc; }
        .skipped-row { background-color: #fff5f5; }
        .skipped-row td { color: #e74c3c; text-decoration: line-through; }
        .skipped-row td:first-child { text-decoration: none; border-left: 4px solid #e74c3c; }

        /* Match Card */
        .match-card { display: flex; justify-content: space-between; align-items: center; background: #fafafa; border: 1px solid #eee; padding: 10px; margin-bottom: 8px; border-radius: 6px; }
        .player-name { font-weight: 600; font-size: 13px; width: 40%; }
        .score-area { width: 20%; display: flex; justify-content: center; gap: 5px; }
        .score-input { width: 30px; text-align: center; font-weight: bold; }

        /* Bracket & Podium */
        .bracket-container { display: flex; flex-direction: row; justify-content: space-between; gap: 10px; overflow-x: auto; padding: 20px 0; }
        .round { display: flex; flex-direction: column; justify-content: flex-start; flex: 1; min-width: 200px; }
        .round-title { text-align: center; font-weight: bold; color: var(--primary); margin-bottom: 10px; border-bottom: 2px solid var(--accent); }
        .match-box { background: white; border: 1px solid #ddd; padding: 10px; margin-bottom: 20px; border-radius: 6px; }
        .match-player { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; font-size: 13px; }
        .match-player:last-child { border-bottom: none; }
        .winner { color: var(--accent); font-weight: bold; }
        .loser { color: var(--danger); opacity: 0.5; text-decoration: line-through; }

        /* Podium */
        .podium-container { margin-top: 30px; background: white; padding: 20px; border-radius: 8px; text-align: center; border: 1px solid #eee; }
        .rank-item { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; font-weight: bold; }
        .rank-1 { color: #f1c40f; font-size: 1.4em; }
        .rank-2 { color: #95a5a6; font-size: 1.2em; }
        .rank-3 { color: #d35400; font-size: 1em; }
        .podium-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; }
        .rank-1 .podium-img { width: 80px; height: 80px; border-color: #f1c40f; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
        .modal-content { max-width: 90%; max-height: 90%; border: 2px solid white; border-radius: 5px; }
        .modal-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }

        /* Admin helpers */
        .hidden { display: none; }
        .participant-row { display: flex; gap: 5px; margin-bottom: 5px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="navbar">
    <button class="tab-link active" onclick="openMainTab('tabCurrent')">GÜNCEL TURNUVA</button>
    <button class="tab-link" onclick="openMainTab('tabHistory')">ESKİ TURNUVALAR</button>
    <button class="tab-link" onclick="openMainTab('tabAdmin')">YÖNETİCİ PANELİ</button>
</div>

<div class="container">
    <div id="loading" style="text-align:center; padding:20px;">Veriler Yükleniyor...</div>

    <div id="tabCurrent" class="tab-content active">
        <div id="currentTournamentArea">
            <div style="text-align:center; color:#777; margin-top:50px;">
                <h3>Şu anda aktif bir turnuva yok.</h3>
                <p>Yönetici panelinden yeni bir turnuva başlatabilirsiniz.</p>
            </div>
        </div>
    </div>

    <div id="tabHistory" class="tab-content">
        <div class="history-type-tabs">
            <button class="history-btn active" onclick="filterHistory('individual')">Bireysel Turnuvalar</button>
            <button class="history-btn" onclick="filterHistory('doubles')">Çift Turnuvaları</button>
        </div>
        <div id="historyList"></div>
    </div>

    <div id="tabAdmin" class="tab-content">
        <div id="loginPanel" class="card">
            <h3>Yönetici Girişi</h3>
            <input type="email" id="email" placeholder="E-Posta">
            <input type="password" id="password" placeholder="Şifre">
            <button class="btn btn-primary" onclick="login()">Giriş Yap</button>
        </div>

        <div id="adminControls" class="card" style="display:none;">
            <h3>Yönetim Paneli</h3>
            
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button class="btn btn-secondary" onclick="showNewTournamentForm()">➕ YENİ TURNUVA BAŞLAT</button>
                <button class="btn btn-danger" onclick="endCurrentTournament()">🏁 GÜNCEL TURNUVAYI BİTİR</button>
            </div>

            <div id="newTournamentForm" class="hidden" style="background:#f9f9f9; padding:15px; border-radius:8px; border:1px solid #ddd; margin-bottom:20px;">
                <h4 style="margin-top:0;">Yeni Turnuva Kurulumu</h4>
                <label>Turnuva Tipi:</label>
                <select id="newTourType" onchange="toggleTeamInput()">
                    <option value="individual">Bireysel Turnuva</option>
                    <option value="doubles">Çift (Takım) Turnuvası</option>
                </select>
                <div id="participantList"></div>
                <button class="btn btn-secondary" style="width:auto; margin-top:10px;" onclick="addParticipantRow()">+ Katılımcı Ekle</button>
                <hr>
                <button class="btn btn-primary" onclick="startNewTournament()">🚀 TURNUVAYI BAŞLAT</button>
            </div>

            <hr style="border-top:1px dashed #ddd;">

            <div class="file-upload">
                <h4 style="margin:0 0 10px 0; color:#555;">Oyuncu Fotoğrafı Yükle</h4>
                <select id="photoPlayerSelect"><option value="">Oyuncu Seçiniz...</option></select>
                <input type="file" id="photoInput" accept="image/*">
                <button class="btn btn-secondary" onclick="uploadPlayerPhoto()">📷 FOTOĞRAFI KAYDET</button>
            </div>

            <hr style="border-top:1px dashed #ddd; margin:20px 0;">

            <div class="file-upload">
                <h4 style="margin:0 0 10px 0; color:#555;">Veri Yönetimi</h4>
                
                <label style="font-weight:bold; display:block;">1. Güncel Turnuvaya Veri Yükle (Overwrite)</label>
                <input type="file" id="jsonFileInput" accept=".json">
                <button class="btn btn-secondary" onclick="importFromPythonJson()">📂 GÜNCEL VERİYİ YÜKLE</button>
                
                <div style="margin:15px 0;"></div>

                <label style="font-weight:bold; display:block; color:#d35400;">2. Geçmişe Eski Turnuva Ekle</label>
                <p style="font-size:11px; color:#777; margin:0;">Elinizdeki eski .json dosyasını "Eski Turnuvalar > Bireysel" altına ekler.</p>
                <input type="file" id="historyJsonInput" accept=".json">
                <button class="btn btn-warning" onclick="importLegacyToHistory()">📂 GEÇMİŞE EKLE</button>

                <div style="margin:15px 0;"></div>

                <label style="font-weight:bold; display:block;">3. Yedekle</label>
                <button class="btn btn-primary" onclick="downloadJsonData()">💾 TÜM VERİYİ İNDİR (JSON)</button>
            </div>
            
            <hr style="border-top:1px solid #ddd; margin:20px 0;">
            <button class="btn btn-danger" onclick="logout()">Çıkış Yap</button>
        </div>
    </div>
</div>

<datalist id="registeredPlayers"></datalist>
<div id="photoModal" class="modal" onclick="closePhotoModal()">
    <span class="modal-close">&times;</span>
    <img class="modal-content" id="modalImg">
</div>
<div id="statusBar" style="position:fixed; bottom:0; left:0; width:100%; background:#333; color:white; padding:12px; text-align:center; display:none; z-index:4000;"></div>

<script>
    const firebaseConfig = {
        apiKey:  "AIzaSyApl74nGCJrG42BWFJaR_v3gqHGlF2R_3M",
        authDomain: "otomotiv-masa-tenisi-turnuvasi.firebaseapp.com",
        databaseURL: "https://otomotiv-masa-tenisi-turnuvasi-default-rtdb.firebaseio.com",
        projectId: "otomotiv-masa-tenisi-turnuvasi",
        storageBucket: "otomotiv-masa-tenisi-turnuvasi.firebasestorage.app",
        messagingSenderId: "88398060894",
        appId: "1:88398060894:web:8b9e4e1198466aae1283cf",
        measurementId: "G-GC6ND6CK6J"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();
    const auth = firebase.auth();

    let dbData = { current: null, history: [], globalPlayers: [] };
    let isAdmin = false;

    window.onload = function() {
        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            updateAdminUI();
            if(dbData.current) renderTournamentView(dbData.current, 'currentTournamentArea', true);
        });

        db.ref('turnuva_v2').on('value', (snapshot) => {
            document.getElementById('loading').style.display = 'none';
            const val = snapshot.val();
            if (val) {
                dbData = val;
                if(!dbData.history) dbData.history = [];
                if(!dbData.globalPlayers) dbData.globalPlayers = [];
            } else {
                db.ref('turnuva_v2').set(dbData);
            }
            updateGlobalPlayerList();
            renderCurrentTournament();
            renderHistory('individual');
        });
    };

    // --- RENDER LOGIC (GENERIC) ---
    function renderTournamentView(tData, containerId, isEditable) {
        const container = document.getElementById(containerId);
        if(!tData) {
            container.innerHTML = '<div style="padding:20px; text-align:center;">Veri Yok</div>';
            return;
        }
        const uid = Math.random().toString(36).substr(2, 9);

        // Turnuva Adı ve Tipi
        let headerTitle = tData.name || "Turnuva";
        let typeLabel = (tData.type === 'doubles') ? 'Çiftler' : 'Bireysel';

        let html = `
            <div class="card">
                <h2 style="color:var(--primary); text-align:center; border-bottom:2px solid var(--accent); padding-bottom:10px;">
                    ${headerTitle} <span style="font-size:12px; font-weight:normal; color:#777;">(${typeLabel})</span>
                </h2>
                
                <div class="inner-navbar">
                    <button class="active" onclick="switchInnerTab('${uid}', 'standings')">PUAN DURUMU</button>
                    <button onclick="switchInnerTab('${uid}', 'fixture')">FİKSTÜR</button>
                    <button onclick="switchInnerTab('${uid}', 'finals')">FİNALLER</button>
                    <button onclick="switchInnerTab('${uid}', 'rules')">KURALLAR</button>
                </div>

                <div id="${uid}-standings" class="inner-content" style="display:block;">
                    ${generateStandingsHTML(tData)}
                    ${(isEditable && isAdmin) ? `<div style="text-align:center; margin-top:20px;"><button class="btn btn-success" onclick="endLeague()">🏆 LİGİ BİTİR VE FİNALLERİ BAŞLAT</button></div>` : ''}
                </div>

                <div id="${uid}-fixture" class="inner-content" style="display:none;">
                    ${generateFixtureHTML(tData, isEditable, containerId)}
                </div>

                <div id="${uid}-finals" class="inner-content" style="display:none;">
                    ${generateFinalsHTML(tData, isEditable, uid)}
                </div>

                <div id="${uid}-rules" class="inner-content" style="display:none;">
                    <div style="padding:15px;">
                        <h4>Kurallar</h4>
                        <ul><li>Maçlar 3 set.</li><li>Galibiyet 2 puan.</li></ul>
                    </div>
                </div>
            </div>
        `;
        container.innerHTML = html;
        
        // Eğer finaller varsa render et (Script tarafında dinamik çalışması için)
        // Geçmiş turnuvalarda inputlar disabled olmalı.
        if(tData.finals && tData.finals.started) {
            // Basitlik için HTML string içinde oluşturduk ama dinamik eventler için
            // renderFinalsLogic benzeri bir yapı gerekebilir.
            // Şimdilik generateFinalsHTML statik HTML üretiyor.
        }
    }

    function generateStandingsHTML(tData) {
        let players = [...(tData.players || [])];
        players.sort((a, b) => {
            if (a.withdrawn && !b.withdrawn) return 1; if (!a.withdrawn && b.withdrawn) return -1;
            if (a.skipPlayoff && !b.skipPlayoff) return 1; if (!a.skipPlayoff && b.skipPlayoff) return -1;
            if (b.stats.p !== a.stats.p) return b.stats.p - a.stats.p;
            if (b.stats.av !== a.stats.av) return b.stats.av - a.stats.av;
            return a.name.localeCompare(b.name);
        });

        let rows = players.map((p, i) => {
            let rowClass = (i < 8 && !p.withdrawn && !p.skipPlayoff) ? 'top8' : '';
            if(p.withdrawn) rowClass = 'withdrawn-row';
            if(p.skipPlayoff) rowClass = 'skipped-row';
            
            // Sadece güncel turnuvada (dbData.current ile eşleşiyorsa) butonlar görünsün
            let isCurrent = (dbData.current && dbData.current.id === tData.id);
            let btns = '';
            if(isCurrent && isAdmin && !p.withdrawn) {
               if(p.skipPlayoff) btns = `<button class="undo-btn" onclick="togglePlayoffSkip('${p.name}')">↩️</button>`;
               else if(i < 8) btns = `<button class="skip-btn" onclick="togglePlayoffSkip('${p.name}')">🚫</button>`;
            }

            return `<tr class="${rowClass}"><td>${i+1}</td><td style="text-align:left;">${p.name} ${btns}</td>
            <td>${p.stats.o}</td><td>${p.stats.g}</td><td>${p.stats.m}</td><td>${p.stats.av}</td><td><strong>${p.stats.p}</strong></td></tr>`;
        }).join('');
        return `<table><thead><tr><th>#</th><th>İsim</th><th>O</th><th>G</th><th>M</th><th>Av</th><th>P</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    function generateFixtureHTML(tData, isEditable, containerId) {
        if(!tData.matches || tData.matches.length === 0) return '<p>Fikstür Yok.</p>';
        let rounds = {};
        tData.matches.forEach((m, idx) => {
            if(!rounds[m.round]) rounds[m.round] = [];
            rounds[m.round].push({...m, idx: idx});
        });

        let html = '';
        const context = isEditable ? 'currentTournamentArea' : 'history'; // Context belirle

        for(let r in rounds) {
            html += `<div class="day-header">${r}. TUR</div>`;
            rounds[r].forEach(m => {
                const disabled = (isEditable && isAdmin) ? '' : 'disabled';
                // Eğer context history ise inputları tamamen disable et
                const finalDisabled = (context === 'history') ? 'disabled' : disabled;
                
                html += `<div class="match-card">
                    <div class="player-name" style="text-align:right;">${m.p1}</div>
                    <div class="score-area">
                        <input type="number" class="score-input" ${finalDisabled} value="${m.s1!=null?m.s1:''}" onchange="updateMatchScore('${context}', ${m.idx}, 's1', this.value)"> - 
                        <input type="number" class="score-input" ${finalDisabled} value="${m.s2!=null?m.s2:''}" onchange="updateMatchScore('${context}', ${m.idx}, 's2', this.value)">
                    </div>
                    <div class="player-name">${m.p2}</div>
                </div>`;
            });
        }
        return html;
    }

    function generateFinalsHTML(tData, isEditable, uid) {
        if(!tData.finals || !tData.finals.started) return '<p style="text-align:center;">Finaller başlamadı.</p>';
        
        // Basit Bracket Çizimi (Statik HTML olarak üreteceğiz)
        // Gerçekten interaktif olması için çok daha fazla JS gerekir, 
        // burada var olan veriyi görselleştiriyoruz.
        
        const seeds = tData.finals.seeds;
        const matches = tData.finals.matches || {};
        const disabled = (isEditable && isAdmin) ? '' : 'disabled';
        const context = isEditable ? 'currentTournamentArea' : 'history';

        // Helper
        const getWinner = (p1, p2, mId) => {
            const m = matches[mId] || {};
            if(m.s1 != null && m.s2 != null) {
                return (parseInt(m.s1) > parseInt(m.s2)) ? p1 : p2;
            }
            return "???";
        }
        const getLoser = (p1, p2, mId) => {
            const m = matches[mId] || {};
            if(m.s1 != null && m.s2 != null) {
                return (parseInt(m.s1) > parseInt(m.s2)) ? p2 : p1;
            }
            return "???";
        }

        // Match Card Generator for Finals
        const mkMatch = (id, p1, p2) => {
            const m = matches[id] || {s1:'', s2:''};
            let c1='', c2='';
            if(m.s1!=='' && m.s2!=='') {
                if(parseInt(m.s1)>parseInt(m.s2)) { c1='winner'; c2='loser'; }
                else { c1='loser'; c2='winner'; }
            }
            // Not: Geçmiş turnuva için onchange çalışsa bile context 'history' olduğu için update fonksiyonu blocklayacak
            return `<div class="match-box">
                <div class="match-player"><span class="${c1}">${p1}</span><input type="number" ${disabled} value="${m.s1}" onchange="updateFinalScore('${context}', '${id}', 's1', this.value)"></div>
                <div class="match-player"><span class="${c2}">${p2}</span><input type="number" ${disabled} value="${m.s2}" onchange="updateFinalScore('${context}', '${id}', 's2', this.value)"></div>
            </div>`;
        };

        // Calculate rounds
        const qf1 = mkMatch('qf1', seeds[0], seeds[7]);
        const qf2 = mkMatch('qf2', seeds[3], seeds[4]);
        const qf3 = mkMatch('qf3', seeds[2], seeds[5]);
        const qf4 = mkMatch('qf4', seeds[1], seeds[6]);

        const sf1_p1 = getWinner(seeds[0], seeds[7], 'qf1');
        const sf1_p2 = getWinner(seeds[3], seeds[4], 'qf2');
        const sf2_p1 = getWinner(seeds[2], seeds[5], 'qf3');
        const sf2_p2 = getWinner(seeds[1], seeds[6], 'qf4');

        const sf1 = mkMatch('sf1', sf1_p1, sf1_p2);
        const sf2 = mkMatch('sf2', sf2_p1, sf2_p2);

        const f_p1 = getWinner(sf1_p1, sf1_p2, 'sf1');
        const f_p2 = getWinner(sf2_p1, sf2_p2, 'sf2');
        const finalMatch = mkMatch('final', f_p1, f_p2);

        const t_p1 = getLoser(sf1_p1, sf1_p2, 'sf1');
        const t_p2 = getLoser(sf2_p1, sf2_p2, 'sf2');
        const thirdMatch = mkMatch('3rdPlace', t_p1, t_p2);

        // Podium Logic
        const w = getWinner(f_p1, f_p2, 'final');
        const l = getLoser(f_p1, f_p2, 'final');
        const t = getWinner(t_p1, t_p2, '3rdPlace');
        
        let podiumHTML = '';
        if(w!=="???" && l!=="???" && t!=="???") {
            const getImg = (name) => {
                const p = tData.players.find(x => x.name === name);
                return (p && p.photo) ? `<img src="${p.photo}" class="podium-img" onclick="openPhotoModal(this.src)">` : '';
            }
            podiumHTML = `<div class="podium-container">
                <div class="podium-header">🏆 TURNUVA SONUCU</div>
                <div class="rank-item rank-1">${getImg(w)} 🥇 ${w}</div>
                <div class="rank-item rank-2">${getImg(l)} 🥈 ${l}</div>
                <div class="rank-item rank-3">${getImg(t)} 🥉 ${t}</div>
            </div>`;
        }

        return `
        <div class="bracket-container">
            <div class="round"><div class="round-title">Çeyrek</div>${qf1}${qf2}${qf3}${qf4}</div>
            <div class="round"><div class="round-title">Yarı</div>${sf1}${sf2}</div>
            <div class="round"><div class="round-title">Final</div>${finalMatch}<div class="bronze-title">3.Lük</div>${thirdMatch}</div>
        </div>
        ${podiumHTML}`;
    }

    // --- IMPORT LEGACY (OLD JSON TO HISTORY) ---
    function importLegacyToHistory() {
        const fileInput = document.getElementById('historyJsonInput');
        if(fileInput.files.length === 0) return alert("Dosya seçiniz.");
        
        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const json = JSON.parse(e.target.result);
                // Veriyi normalize et
                // Eski Python yapısı: {oyuncular:[], maclar:[]} -> {players:[], matches:[]}
                let cleanData = { players: [], matches: [], finals: {started:false} };
                
                if(json.oyuncular) {
                    cleanData.players = json.oyuncular.map(name => ({name: name, withdrawn:false, stats:{p:0,o:0,g:0,m:0,av:0}}));
                } else if(json.players) {
                    cleanData.players = json.players;
                }

                if(json.maclar) {
                    cleanData.matches = json.maclar.map(m => ({round: m.gun, p1:m.p1, p2:m.p2, s1:m.s1, s2:m.s2}));
                } else if(json.matches) {
                    cleanData.matches = json.matches;
                }
                
                // Finals varsa al
                if(json.finals) cleanData.finals = json.finals;

                // Puanları hesapla ki listede düzgün dursun
                // (Burada local calculateStandings kullanılamaz çünkü referans tData)
                // Bu yüzden basit bir hesaplama yapıp cleanData'ya işleyelim
                cleanData.players.forEach(p => p.stats = {p:0,o:0,g:0,m:0,av:0});
                cleanData.matches.forEach(m => {
                    if(m.s1!=null && m.s2!=null && m.s1!=="" && m.s2!=="") {
                        const p1 = cleanData.players.find(p=>p.name===m.p1);
                        const p2 = cleanData.players.find(p=>p.name===m.p2);
                        if(p1 && p2) {
                            let s1=parseInt(m.s1), s2=parseInt(m.s2);
                            p1.stats.o++; p2.stats.o++;
                            p1.stats.av+=(s1-s2); p2.stats.av+=(s2-s1);
                            if(s1>s2) { p1.stats.g++; p1.stats.p+=2; p2.stats.m++; p2.stats.p+=1; }
                            else { p2.stats.g++; p2.stats.p+=2; p1.stats.m++; p1.stats.p+=1; }
                        }
                    }
                });

                // İsim Sor
                const tourName = prompt("Bu turnuva için bir isim giriniz (Örn: 2024 Yaz):", "Eski Turnuva");
                if(!tourName) return;

                const newHistoryItem = {
                    id: Date.now().toString(),
                    type: 'individual', // Varsayılan olarak bireysel atıyoruz
                    name: tourName,
                    date: new Date().toLocaleDateString(),
                    data: cleanData
                };

                // Firebase'e ekle
                if(!dbData.history) dbData.history = [];
                dbData.history.push(newHistoryItem);
                
                db.ref('turnuva_v2').set(dbData)
                    .then(() => {
                        alert("Geçmişe başarıyla eklendi!");
                        renderHistory('individual');
                    });

            } catch(err) {
                alert("Dosya okuma hatası: " + err.message);
            }
        };
        reader.readAsText(file);
    }

    function showNewTournamentForm() {

    }

    function addParticipantRow() {
        const type = document.getElementById('newTourType').value;
        const div = document.createElement('div');
        div.className = 'participant-row';
        if(type==='individual') div.innerHTML = `<input type="text" class="p-input" list="registeredPlayers" placeholder="Oyuncu Adı">`;
        else div.innerHTML = `<input type="text" class="t-name" placeholder="Takım Adı" style="width:30%"><input type="text" class="p1-input" list="registeredPlayers" placeholder="P1" style="width:30%"><input type="text" class="p2-input" list="registeredPlayers" placeholder="P2" style="width:30%">`;
        document.getElementById('participantList').appendChild(div);
    }

    function startNewTournament() {
        if(dbData.current) return alert("Aktif turnuva var.");
        const type = document.getElementById('newTourType').value;
        const rows = document.querySelectorAll('#participantList .participant-row');
        let players = [];
        
        rows.forEach(r => {
            if(type==='individual') {
                const name = r.querySelector('.p-input').value.trim();
                if(name) players.push({name:name, withdrawn:false, stats:{p:0,o:0,g:0,m:0,av:0}});
            } else {
                const t = r.querySelector('.t-name').value.trim();
                const p1 = r.querySelector('.p1-input').value.trim();
                const p2 = r.querySelector('.p2-input').value.trim();
                if(t && p1 && p2) players.push({name:t, members:[p1,p2], withdrawn:false, stats:{p:0,o:0,g:0,m:0,av:0}});
            }
        });

        if(players.length < 2) return alert("En az 2 katılımcı gerekli.");

        const count = dbData.history.filter(t => t.type === type).length + 1;
        const tourName = `${count}. ${type==='individual'?'Bireysel':'Çiftler'} Turnuvası`;

        let matches = [];
        for(let i=0; i<players.length; i++) {
            for(let j=i+1; j<players.length; j++) {
                matches.push({round:1, p1:players[i].name, p2:players[j].name, s1:null, s2:null});
            }
        }

        // Global list update
        let newGlobals = [...dbData.globalPlayers];
        players.forEach(p => {
            if(p.members) p.members.forEach(m => {if(!newGlobals.includes(m)) newGlobals.push(m)});
            else if(!newGlobals.includes(p.name)) newGlobals.push(p.name);
        });

        dbData.current = {
            id: Date.now().toString(),
            name: tourName,
            type: type,
            players: players,
            matches: matches,
            finals: { started: false }
        };
        dbData.globalPlayers = newGlobals;

        db.ref('turnuva_v2').update(dbData).then(()=>{
            alert("Başlatıldı!");
            document.getElementById('newTournamentForm').classList.add('hidden');
            openMainTab('tabCurrent');
        });
    }

    function endCurrentTournament() {
        if(!dbData.current) return alert("Turnuva yok.");
        if(!confirm("Bitirmek istiyor musunuz?")) return;
        
        const archive = {
            id: dbData.current.id,
            type: dbData.current.type,
            name: dbData.current.name,
            date: new Date().toLocaleDateString(),
            data: dbData.current
        };
        
        if(!dbData.history) dbData.history = [];
        dbData.history.push(archive);
        dbData.current = null;
        
        db.ref('turnuva_v2').set(dbData).then(()=>{
            alert("Arşivlendi.");
            renderCurrentTournament();
            renderHistory('individual');
        });
    }

    window.updateMatchScore = function(ctx, idx, f, v) {
        if(!isAdmin || ctx !== 'currentTournamentArea') return;
        dbData.current.matches[idx][f] = v;
        calculateStandings(dbData.current);
        db.ref('turnuva_v2/current').set(dbData.current);
    }

    window.updateFinalScore = function(ctx, mid, f, v) {
        if(!isAdmin || ctx !== 'currentTournamentArea') return;
        if(!dbData.current.finals.matches) dbData.current.finals.matches = {};
        if(!dbData.current.finals.matches[mid]) dbData.current.finals.matches[mid] = {};
        dbData.current.finals.matches[mid][f] = v;
        db.ref('turnuva_v2/current/finals').set(dbData.current.finals);
        // UI auto updates on value change
    }

    function calculateStandings(tData) {
        tData.players.forEach(p => p.stats = {p:0,o:0,g:0,m:0,av:0});
        const wList = tData.players.filter(p=>p.withdrawn).map(p=>p.name);
        
        tData.matches.forEach(m => {
            const p1 = tData.players.find(p=>p.name===m.p1);
            const p2 = tData.players.find(p=>p.name===m.p2);
            if(!p1 || !p2) return;

            const w1 = wList.includes(m.p1);
            const w2 = wList.includes(m.p2);

            if(w1 && w2) return;
            else if(w1) { p1.stats.o++; p2.stats.o++; p1.stats.y+=2; p2.stats.a+=2; p2.stats.g++; p2.stats.p+=2; p1.stats.m++; }
            else if(w2) { p1.stats.o++; p2.stats.o++; p2.stats.y+=2; p1.stats.a+=2; p1.stats.g++; p1.stats.p+=2; p2.stats.m++; }
            else if(m.s1!=null && m.s2!=null && m.s1!=="" && m.s2!=="") {
                let s1=parseInt(m.s1), s2=parseInt(m.s2);
                p1.stats.o++; p2.stats.o++;
                p1.stats.a+=s1; p1.stats.y+=s2; p2.stats.a+=s2; p2.stats.y+=s1;
                if(s1>s2) { p1.stats.g++; p1.stats.p+=2; p2.stats.m++; p2.stats.p+=1; }
                else { p2.stats.g++; p2.stats.p+=2; p1.stats.m++; p1.stats.p+=1; }
            }
        });
        tData.players.forEach(p => p.stats.av = (p.stats.a || 0) - (p.stats.y || 0));
    }

    window.endLeague = function() {
        if(!confirm("İlk 8 finallere taşınacak?")) return;
        // Sıralama zaten calculateStandings ile yapıldı varsayıyoruz, ama garanti olsun diye sortlayalım
        let sorted = [...dbData.current.players].sort((a,b) => {
             if (a.withdrawn && !b.withdrawn) return 1; if (!a.withdrawn && b.withdrawn) return -1;
             if (a.skipPlayoff && !b.skipPlayoff) return 1; if (!a.skipPlayoff && b.skipPlayoff) return -1;
             if (b.stats.p !== a.stats.p) return b.stats.p - a.stats.p;
             if (b.stats.av !== a.stats.av) return b.stats.av - a.stats.av;
             return a.name.localeCompare(b.name);
        });
        
        let seeds = sorted.slice(0,8).map(p=>p.name);
        while(seeds.length < 8) seeds.push("BYE");
        
        dbData.current.finals = { started: true, seeds: seeds, matches: {} };
        db.ref('turnuva_v2/current').set(dbData.current);
        // Tab açma işlemi render sonrası otomatik olmuyor, manuel tetikleyelim
        setTimeout(()=> document.querySelector(`button[onclick*="finals"]`).click(), 500); 
    }

    window.togglePlayoffSkip = function(name) {
        const p = dbData.current.players.find(x=>x.name===name);
        if(p) {
            p.skipPlayoff = !p.skipPlayoff;
            calculateStandings(dbData.current);
            db.ref('turnuva_v2/current').set(dbData.current);
        }
    }

    // Photo Upload (Aynı logic)
    window.populatePlayerSelect = function() {
        const sel = document.getElementById('photoPlayerSelect');
        sel.innerHTML = '<option>Seçiniz...</option>';
        if(dbData.current) {
            dbData.current.players.forEach(p => {

    window.uploadPlayerPhoto = function() {
        const name = document.getElementById('photoPlayerSelect').value;
        const file = document.getElementById('photoInput').files[0];
        if(!name || !file) return alert("Eksik bilgi.");
        
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const cvs = document.createElement('canvas');
                const ctx = cvs.getContext('2d');
                const max = 800;
                let w = img.width, h = img.height;
                if(w>h){ if(w>max){h*=max/w; w=max}} else { if(h>max){w*=max/h; h=max}}
                cvs.width=w; cvs.height=h;
                ctx.drawImage(img,0,0,w,h);
                const data = cvs.toDataURL('image/jpeg', 0.8);
                
                const p = dbData.current.players.find(x=>x.name===name);
                if(p) {
                    p.photo = data;
                    db.ref('turnuva_v2/current').set(dbData.current).then(()=>alert("Yüklendi"));
                }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // Download/Import JSON Helpers
    window.downloadJsonData = function() {
        const s = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dbData,null,2));
        const a = document.createElement('a'); a.href=s; a.download="turnuva_yedek.json"; document.body.appendChild(a); a.click(); a.remove();
    }
    
    window.importFromPythonJson = function() {
        const f = document.getElementById('jsonFileInput').files[0];
        if(!f) return alert("Dosya yok.");
        const r = new FileReader();
        r.onload = function(e) {
            try {
                const j = JSON.parse(e.target.result);
                // Basit map
                const ps = (j.oyuncular || j.players).map(n => ({name:n.name||n, withdrawn:false, stats:{p:0,o:0,g:0,m:0,av:0}}));
                const ms = (j.maclar || j.matches).map(m => ({round:m.gun||m.round, p1:m.p1, p2:m.p2, s1:m.s1, s2:m.s2}));
                dbData.current = { id:Date.now().toString(), name:"İçe Aktarılan", type:'individual', players:ps, matches:ms, finals:{started:false}};
                calculateStandings(dbData.current);
                db.ref('turnuva_v2').update(dbData).then(()=>alert("Yüklendi"));
            } catch(x){alert("Hata");}
        };
        r.readAsText(f);
    }
